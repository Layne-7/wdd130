<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This is an About Us page, explaining the mission, values and showcasing the company.">
    <meta name="author" content="Derek Layne Santos de Oliveira">
    <title>Contact Us Rapids Water Rafting</title>
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/rapids-logo.jpeg" alt="Water rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1></h1>

        <section class="contact-info">

            <h2>Rapids Water Rafting</h2>

            <p>123 Main River Street</p>
            <p>Sacramento, California</p>
            <p>+1 999 999 999</p>
            <p>info@rapidsrafting.com</p>

        </section>

        <section class="contact-content">

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d199666.26291652123!2d-121.46173905!3d38.56175885!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-PT!2sbr!4v1785463609538!5m2!1spt-PT!2sbr"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form class="contact-form">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Placeholder">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Placeholder">

                <label>Message Purpose</label>
                <div class="radio-group">
                    <label><input type="radio" id="general" name="purpose"> General Inquiry</label>
                    <label><input type="radio" id="reservation" name="purpose"> Reservation
                        Question</label>
                    <label><input type="radio" id="website" name="purpose"> Website
                        Suggestion</label>
                </div>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>

                <div></div>
                <label class="newsletter">
                    <input type="checkbox" id="subscribe" name="purpose">
                    Please Subscribe me to the monthly newsletter
                </label>

                <div></div>
                <button type="submit">Get in touch</button>

            </form>
        </section>


        <section class="adventure">
            <h2>We Are Here to Serve You</h2>
            <div class="gallery">
                <figure>
                    <img src="images/adventure-1.jpg" alt="Rafters navigating rapids">
                    <figcaption>Rafting</figcaption>
                </figure>

                <figure>
                    <img src="images/adventure-3.jpg" alt="Campsite by the water">
                    <figcaption>Camping</figcaption>
                </figure>

                <figure>
                    <img src="images/adventure-5.jpg" alt="Sunset view over the rapids">
                    <figcaption>Watching Sunset</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026, Rapids Rafting Company, Derek Layne</p>

        <nav class="socialmedia">
            <a href="https://www.instagram.com/">
                <img src="images/instagram-circle.jpg" alt="Instagram icon">
            </a>

            <a href="https://www.facebook.com/">
                <img src="images/facebook-circle.jpg" alt="Faceboook icon">
            </a>
            <a href="https://br.linkedin.com/">
                <img src="images/linkedin-circle.jpg" alt="Linkedin icon">
            </a>
        </nav>
    </footer>
</body>

</html>
