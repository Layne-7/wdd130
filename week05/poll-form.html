<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>

    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>

    <main>

        <form action="#">
            <fieldset>

                <legend>Contact Information</legend>
                <div class="form-item">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item column2">
                    <label for="useremail">Email Adress:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <label for="browser">What is your favorite browser?</label>

                <div class="column1">
                    <select name="browsers" id="browser">
                        <option value="Google">Chrome</option>
                        <option value="Microsoft Edge">Microsoft Edge</option>
                        <option value="Firefox">Firefox</option>
                    </select>
                </div>

                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">

                <label for="feedback">List the places you have lived</label>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="Brazil, Germany, Japan"></textarea>
            </fieldset>


            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer></footer>
</body>

</html>
